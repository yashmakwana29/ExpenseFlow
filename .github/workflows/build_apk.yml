name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Android APK with Flet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flet build apk --project expenseflow --product "ExpenseFlow" --org "com.expenseflow.app" --arch arm64-v8a armeabi-v7a --android-permissions android.permission.INTERNET=true --output dist --yes --no-rich-output -v

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseFlow-Android-APK
          path: |
            dist/**/*.apk
            dist/*.apk
            build/**/*.apk
          if-no-files-found: warn
